spring:
  application:
    name: spotmyfy-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/spotmyfy
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: 9f4c7d2a1b8e6f3c5d0a7e9b1c4f6a8d2e5f7c9b0a1d3e6f8c2b4a7d9e1f5c3
    expiration-minutes: 60
