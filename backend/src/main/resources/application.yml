spring:
  application:
    name: music-stream-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/music_stream}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
